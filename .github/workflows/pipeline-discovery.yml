name: "Pipeline: Automated Discovery"

# Scans external sources for new CVEs/incidents and promotes recent
# incident-linked threat actors and campaign clusters into pipeline tasks.
#
# This workflow is a thin wrapper around scripts/pipeline-discover.mjs —
# the single source of truth for discovery logic (feed fetch, scoring,
# dedup, task emission). All ROAD-011 scoring, ADR 0007 ID allocation, and
# dispatcher-compatible task shape come from there.
#
# Execution model stays subscription-backed and agent-agnostic:
#   - this workflow creates tasks only, on a long-lived branch
#   - a PR is opened/updated from that branch (branch protection on main
#     requires PRs — direct pushes are rejected)
#   - pipeline-dispatcher.yml hands merged tasks to agents
#   - agents execute under their own subscriptions via
#     scripts/pipeline-run-task.mjs (no API key required on this path)
#
# Publishing model:
#   - Branch: `pipeline/discovery` (long-lived until merged or closed)
#   - One PR open at a time from that branch. Subsequent runs push
#     additional task files to the same branch and update the PR body;
#     new PR is only opened when no open one exists (first run, or
#     after the previous one was merged/closed).
#   - Merge PR to accept the whole batch; close PR (without merging)
#     to discard the staged batch. Durable vetoes belong in
#     pipeline-reject.yml / rejected-candidates.json. Nothing auto-merges.
#
# See docs/PIPELINE.md for the end-to-end flow.

on:
  schedule:
    - cron: "0 */3 * * *"   # Every 3 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "Discovery lane (all, zero-day, incident, threat-actor, campaign)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "zero-day"
          - "incident"
          - "threat-actor"
          - "campaign"
      days:
        description: "Lookback window in days (default: 14)"
        required: false
        default: "14"
      limit:
        description: "Max tasks to create per run (default: 20)"
        required: false
        default: "20"
      execute:
        description: "Write task files (true) or dry-run (false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  DISCOVERY_BRANCH: pipeline/discovery
  DISCOVERY_LABEL: pipeline/discovery
  VULNCHECK_PREFILL_BRANCH_PREFIX: pipeline/vulncheck-prefill

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install script dependencies
        run: |
          set -euo pipefail
          cd scripts
          npm ci --no-audit --no-fund

      - name: Configure git
        if: ${{ inputs.execute != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout discovery branch
        if: ${{ inputs.execute != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BRANCH="${DISCOVERY_BRANCH}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH exists on remote — checking open PR state"
            # An open PR from this branch means the previous batch is still pending
            # human review — accumulate onto it. No open PR means the previous batch
            # was either merged (tasks now on main) or closed-without-merging
            # (discarded batch). Both cases collapse to "reset to main" so stale
            # branch-only tasks do not silently linger on the next run.
            OPEN_PRS=$(curl -sSf \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}&per_page=5" \
              | python3 -c 'import sys,json; print(len(json.loads(sys.stdin.read(), strict=False)))')

            if [ "$OPEN_PRS" = "0" ]; then
              echo "No open PR on $BRANCH — previous batch was merged or closed."
              echo "Resetting branch to origin/main (drops any stale rejected tasks)."
              git fetch origin main
              git checkout -B "$BRANCH" origin/main
              git push --force-with-lease origin "$BRANCH"
            else
              echo "Open PR exists on $BRANCH — accumulating onto existing branch"
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              echo "Merging latest main into $BRANCH"
              if ! git merge --no-edit origin/main; then
                echo "::error::Merge conflict between $BRANCH and main. Human resolution required."
                git merge --abort || true
                exit 1
              fi
            fi
          else
            echo "Branch $BRANCH does not exist — creating from main"
            git checkout -b "$BRANCH"
          fi

      - name: Run discovery
        id: discover
        env:
          MODE: ${{ inputs.mode || 'all' }}
          DAYS: ${{ inputs.days || '14' }}
          LIMIT: ${{ inputs.limit || '20' }}
          EXECUTE: ${{ inputs.execute || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Running pipeline-discover.mjs (mode=${MODE}, days=${DAYS}, limit=${LIMIT}, execute=${EXECUTE})"

          ARGS="--mode ${MODE} --days ${DAYS} --limit ${LIMIT}"
          if [ "${EXECUTE}" = "true" ]; then
            ARGS="${ARGS} --execute"
          fi

          node scripts/pipeline-discover.mjs ${ARGS}

      - name: Commit new tasks to branch
        id: commit
        if: ${{ inputs.execute != 'false' }}
        run: |
          set -euo pipefail
          git add .github/pipeline/tasks/
          if git diff --cached --quiet; then
            echo "No new discoveries this run — branch unchanged."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(pipeline): auto-discovery $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin "${DISCOVERY_BRANCH}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create or update discovery PR
        if: ${{ inputs.execute != 'false' && steps.commit.outputs.has_changes == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const BRANCH = process.env.DISCOVERY_BRANCH;
            const LABEL = process.env.DISCOVERY_LABEL;
            const REVIEWERS = ['MahdiHedhli', 'dangermouse-bot', 'ernestpenfold-bot'];
            const { owner, repo } = context.repo;

            async function requestDiscoveryReviewers(pullNumber) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  reviewers: REVIEWERS,
                });
                console.log(`Requested reviewers on PR #${pullNumber}: ${REVIEWERS.join(', ')}`);
              } catch (e) {
                console.log(`Could not request all discovery reviewers on PR #${pullNumber}: ${e.message}`);
              }
            }

            // ── Enumerate task files currently on the discovery branch but
            //    not on main. VulnCheck source-packet prefills are normally
            //    staged through their own bounded PR lane; packet enumeration
            //    remains here only so legacy discovery branches are visible.
            let taskPaths = [];
            let packetPaths = [];
            try {
              const taskDiffOut = execSync(
                `git diff --name-only origin/main...HEAD -- '.github/pipeline/tasks/*.json'`,
                { encoding: 'utf8' },
              );
              taskPaths = taskDiffOut.split('\n').map(s => s.trim()).filter(Boolean);
              const packetDiffOut = execSync(
                `git diff --name-only origin/main...HEAD -- '.github/pipeline/source-packets/vulncheck-kev/*.json'`,
                { encoding: 'utf8' },
              );
              packetPaths = packetDiffOut.split('\n').map(s => s.trim()).filter(Boolean);
            } catch (e) {
              console.log(`Failed to enumerate branch-only discovery files: ${e.message}`);
              return;
            }

            if (taskPaths.length === 0 && packetPaths.length === 0) {
              console.log('No branch-only task or source-packet files detected. Skipping PR update.');
              return;
            }

            // ── Read each task to extract the display metadata
            const tasks = [];
            for (const p of taskPaths) {
              try {
                const t = JSON.parse(fs.readFileSync(p, 'utf8'));
                const cd = (t.input && t.input.candidate_data) || {};
                const cve = cd.cve || (Array.isArray(cd.cves) && cd.cves[0]) || '—';
                const topic = (t.input && t.input.topic) || '—';
                tasks.push({
                  task_id: t.task_id,
                  type: t.type || '—',
                  priority: t.priority || '—',
                  score: (t.discovery && t.discovery.score) ?? null,
                  auto_certify: !!(t.discovery && t.discovery.auto_certify),
                  cve,
                  source: (Array.isArray(t.input?.sources) && t.input.sources[0]) || '—',
                  topic,
                });
              } catch (e) {
                console.log(`Failed to parse ${p}: ${e.message}`);
              }
            }

            const packets = [];
            for (const p of packetPaths) {
              if (p.endsWith('/latest.json')) continue;
              try {
                const packet = JSON.parse(fs.readFileSync(p, 'utf8'));
                const candidate = packet.candidate || {};
                const prefill = packet.source_packet_prefill || {};
                const product = (prefill.affected_products && prefill.affected_products[0]) || {};
                packets.push({
                  path: p,
                  cves: Array.isArray(candidate.cves) ? candidate.cves : [],
                  bucket: candidate.recency_bucket || '—',
                  date: candidate.vulncheck_exploitation_signal?.date_added || '—',
                  score: candidate.priority_score ?? null,
                  officialCisa: !!candidate.official_cisa_kev?.listed,
                  canary: !!candidate.vulncheck_exploitation_signal?.reported_exploited_by_vulncheck_canaries,
                  vendor: product.vendor || '—',
                  product: product.product || '—',
                });
              } catch (e) {
                console.log(`Failed to parse ${p}: ${e.message}`);
              }
            }

            tasks.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
            packets.sort((a, b) => {
              if (a.date !== b.date) return String(b.date).localeCompare(String(a.date));
              return (b.score ?? 0) - (a.score ?? 0);
            });

            // ── Ensure the label exists (best-effort)
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (e) {
              if (e.status === 404) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo,
                    name: LABEL,
                    color: 'f9d71c',
                    description: 'Automated discovery pipeline — scheduled runs open and update PRs with this label',
                  });
                  console.log(`Created label ${LABEL}`);
                } catch (e2) {
                  console.log(`Could not create label ${LABEL}: ${e2.message} — continuing without label`);
                }
              }
            }

            // ── Format PR body
            const nowIso = new Date().toISOString();
            const titleParts = [];
            if (tasks.length > 0) titleParts.push(`${tasks.length} task${tasks.length === 1 ? '' : 's'}`);
            if (packets.length > 0) titleParts.push(`${packets.length} VulnCheck prefill${packets.length === 1 ? '' : 's'}`);
            const title = `Pipeline discovery — ${titleParts.join(' + ')} pending`;

            let body = `## Automated Discovery — pending queue\n\n`;
            body += `This PR accumulates task candidates produced by the scheduled discovery workflow `;
            body += `(\`.github/workflows/pipeline-discovery.yml\`). Task candidates here are staged for your review `;
            body += `on the \`${BRANCH}\` branch before landing on \`main\`.\n\n`;
            body += `VulnCheck KEV source-packet prefills are staged in separate bounded PRs once their queue has branch headroom.\n\n`;
            body += `**Merge** to accept the whole batch. **Close** (without merging) to discard this staged batch.\n`;
            body += `For a durable veto across future discovery runs, use the rejection-memory workflow and merge its PR.\n`;
            body += `Nothing auto-merges from this PR.\n\n`;
            body += `Review requested: @MahdiHedhli @dangermouse-bot @ernestpenfold-bot.\n\n`;
            body += `---\n\n`;
            if (tasks.length > 0) {
              body += `**${tasks.length} task${tasks.length === 1 ? '' : 's'}** currently pending review.\n\n`;
              body += `| Task | Type | Pri | Score | Auto-cert | Reference | Topic |\n`;
              body += `|---|---|---|---:|:-:|---|---|\n`;
              for (const t of tasks) {
                const scoreCell = t.score == null ? '—' : String(t.score);
                const certCell = t.auto_certify ? '✓' : '—';
                const topicCell = t.topic.length > 80 ? t.topic.slice(0, 77) + '…' : t.topic;
                const refCell = t.cve !== '—'
                  ? `\`${t.cve}\``
                  : (t.source !== '—' ? `[source](${t.source})` : '—');
                body += `| \`${t.task_id}\` | ${t.type} | ${t.priority} | ${scoreCell} | ${certCell} | ${refCell} | ${topicCell.replace(/\|/g, '\\|')} |\n`;
              }
              body += `\n`;
            }
            if (packets.length > 0) {
              body += `**${packets.length} VulnCheck KEV source-packet prefill${packets.length === 1 ? '' : 's'}** currently pending review.\n\n`;
              body += `These are prioritization/source-packet artifacts only. They do not create article drafts, do not mark official CISA KEV membership, and require prominent VulnCheck KEV attribution if surfaced.\n\n`;
              body += `| CVE | Date added | Bucket | Score | CISA date present | Canary signal | Vendor / product | Artifact |\n`;
              body += `|---|---|---|---:|:-:|:-:|---|---|\n`;
              for (const packet of packets) {
                const cveCell = packet.cves.length > 0 ? packet.cves.map(cve => `\`${cve}\``).join(', ') : '—';
                const artifact = packet.path.replace(/^\.\//, '');
                body += `| ${cveCell} | ${packet.date} | ${packet.bucket} | ${packet.score == null ? '—' : packet.score} | ${packet.officialCisa ? '✓' : '—'} | ${packet.canary ? '✓' : '—'} | ${`${packet.vendor} / ${packet.product}`.replace(/\|/g, '\\|')} | \`${artifact}\` |\n`;
              }
              body += `\n`;
            }
            body += `\n---\n\n`;
            body += `_Last updated: ${nowIso} · Run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) · See [docs/PIPELINE.md](${context.serverUrl}/${owner}/${repo}/blob/main/docs/PIPELINE.md) for the end-to-end flow._\n`;

            // ── Find existing open PR from our branch
            const { data: existing } = await github.rest.pulls.list({
              owner, repo,
              state: 'open',
              head: `${owner}:${BRANCH}`,
              per_page: 5,
            });

            if (existing.length > 0) {
              const pr = existing[0];
              console.log(`Updating existing PR #${pr.number}`);
              await github.rest.pulls.update({
                owner, repo,
                pull_number: pr.number,
                title,
                body,
              });
              await requestDiscoveryReviewers(pr.number);
            } else {
              console.log('Creating new discovery PR');
              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                head: BRANCH,
                base: 'main',
                title,
                body,
              });
              try {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
              } catch (e) {
                console.log(`Could not add label ${LABEL} to PR #${pr.number}: ${e.message}`);
              }
              await requestDiscoveryReviewers(pr.number);
              console.log(`Opened PR #${pr.number}: ${pr.html_url}`);
            }

      - name: Dispatch discovery task validation
        if: ${{ inputs.execute != 'false' && steps.commit.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/pipeline-discovery-validation-dispatch.mjs \
            --branch "${DISCOVERY_BRANCH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "pipeline-validate-tasks.yml" \
            --wait-seconds 30

      - name: Run VulnCheck KEV source-packet intake branch
        id: vulncheck
        if: ${{ inputs.execute != 'false' && (inputs.mode == '' || inputs.mode == 'all' || inputs.mode == 'zero-day') }}
        env:
          VULNCHECKAPI: ${{ secrets.VULNCHECKAPI }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${VULNCHECKAPI:-}" ]; then
            echo "::error::VULNCHECKAPI secret is not configured; VulnCheck production intake cannot run safely."
            exit 1
          fi

          CONFIG_JSON="$(node scripts/pipeline-config.mjs)"
          PER_RUN_LIMIT="$(node -e 'const c = JSON.parse(process.argv[1]); console.log(c.discovery_sources?.vulncheck_kev?.max_candidates || 30);' "$CONFIG_JSON")"
          PENDING_CAP="$(node -e 'const c = JSON.parse(process.argv[1]); console.log(c.queues?.source_packets?.max_pending || c.queues?.supply_chain_candidates?.max_pending || c.queues?.draft_ready?.max_pending || 40);' "$CONFIG_JSON")"
          BASE_BRANCH="${VULNCHECK_PREFILL_BRANCH_PREFIX}"
          BRANCH="${BASE_BRANCH}"
          OPEN_PREFILL_JSON="$RUNNER_TEMP/open-vulncheck-prefill-prs.json"

          branch_prefill_count() {
            local ref="$1"
            git diff --name-only origin/main..."$ref" -- '.github/pipeline/source-packets/vulncheck-kev/*.json' \
              | awk '!/\/latest\.json$/ { count += 1 } END { print count + 0 }'
          }

          curl -sSf \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > "$OPEN_PREFILL_JSON"

          mapfile -t OPEN_PREFILL_BRANCHES < <(python3 - "$OPEN_PREFILL_JSON" "$BASE_BRANCH" <<'PY'
          import json
          import sys
          path, prefix = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as handle:
              pulls = json.load(handle)
          branches = []
          for pr in pulls:
              ref = (pr.get('head') or {}).get('ref') or ''
              if ref == prefix or ref.startswith(f'{prefix}-'):
                  branches.append(ref)
          for ref in sorted(set(branches), key=lambda item: (item != prefix, item)):
              print(ref)
          PY
          )

          SELECTED_BRANCH=""
          for candidate_branch in "${OPEN_PREFILL_BRANCHES[@]}"; do
            git fetch origin "$candidate_branch"
            PENDING_PREFILLS="$(branch_prefill_count "origin/${candidate_branch}")"
            if [ "$PENDING_PREFILLS" -lt "$PENDING_CAP" ]; then
              SELECTED_BRANCH="$candidate_branch"
              echo "Reusing open VulnCheck prefill branch ${SELECTED_BRANCH} with ${PENDING_PREFILLS}/${PENDING_CAP} prefills."
              break
            fi
            echo "Open VulnCheck prefill branch ${candidate_branch} is full (${PENDING_PREFILLS}/${PENDING_CAP})."
          done

          if [ -n "$SELECTED_BRANCH" ]; then
            BRANCH="$SELECTED_BRANCH"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          elif git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null 2>&1 \
              && ! printf '%s\n' "${OPEN_PREFILL_BRANCHES[@]}" | grep -qx "$BASE_BRANCH"; then
            echo "No open VulnCheck PR on ${BASE_BRANCH}; resetting reusable branch to origin/main."
            git checkout -B "$BASE_BRANCH" origin/main
            git push --force-with-lease origin "$BASE_BRANCH"
          elif [ "${#OPEN_PREFILL_BRANCHES[@]}" -gt 0 ]; then
            BRANCH="${BASE_BRANCH}-${GITHUB_RUN_ID}"
            echo "All open VulnCheck prefill PRs are full; rolling over to ${BRANCH}."
            git checkout -B "$BRANCH" origin/main
          else
            echo "Creating reusable VulnCheck prefill branch ${BASE_BRANCH}."
            git checkout -B "$BASE_BRANCH" origin/main
          fi

          SEEN_PREFILL_CVES="$(
            for candidate_branch in "${OPEN_PREFILL_BRANCHES[@]}"; do
              git fetch origin "$candidate_branch" >/dev/null 2>&1 || continue
              git diff --name-only origin/main..."origin/${candidate_branch}" -- '.github/pipeline/source-packets/vulncheck-kev/*.json'
            done | python3 - <<'PY'
          import re
          import sys
          cves = set()
          for line in sys.stdin:
              match = re.search(r'prefill-(cve-\d{4}-\d{4,})-', line, re.I)
              if match:
                  cves.add(match.group(1).upper())
          print(','.join(sorted(cves)))
          PY
          )"

          PENDING_PREFILLS="$(branch_prefill_count HEAD)"
          HEADROOM=$((PENDING_CAP - PENDING_PREFILLS))
          if [ "$HEADROOM" -le 0 ]; then
            BRANCH="${BASE_BRANCH}-${GITHUB_RUN_ID}"
            echo "Active VulnCheck branch is full; rolling over to ${BRANCH}."
            git checkout -B "$BRANCH" origin/main
            PENDING_PREFILLS=0
            HEADROOM="$PENDING_CAP"
          fi

          RUN_LIMIT="$PER_RUN_LIMIT"
          if [ "$RUN_LIMIT" -gt "$HEADROOM" ]; then
            RUN_LIMIT="$HEADROOM"
          fi

          echo "VulnCheck KEV source-packet headroom on ${BRANCH}: ${PENDING_PREFILLS}/${PENDING_CAP}; running intake with --max-candidates ${RUN_LIMIT}."
          SEEN_ARGS=()
          if [ -n "$SEEN_PREFILL_CVES" ]; then
            SEEN_ARGS=(--seen-cves "$SEEN_PREFILL_CVES")
          fi
          node scripts/vulncheck-kev-intake.mjs \
            --execute \
            --max-candidates "$RUN_LIMIT" \
            "${SEEN_ARGS[@]}" \
            --cache "$RUNNER_TEMP/vulncheck-kev-backup.json" \
            --out "$RUNNER_TEMP/vulncheck-kev-intake-result.json"

          git add .github/pipeline/source-packets/vulncheck-kev/
          if git diff --cached --quiet; then
            echo "No new VulnCheck source-packet prefills this run."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(pipeline): VulnCheck source-packet prefill $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create or update VulnCheck source-packet PR
        if: ${{ inputs.execute != 'false' && steps.vulncheck.outputs.has_changes == 'true' }}
        uses: actions/github-script@v8
        env:
          VULNCHECK_BRANCH: ${{ steps.vulncheck.outputs.branch }}
          VULNCHECK_LABEL: pipeline/discovery
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const BRANCH = process.env.VULNCHECK_BRANCH;
            const LABEL = process.env.VULNCHECK_LABEL;
            const REVIEWERS = ['MahdiHedhli', 'dangermouse-bot', 'ernestpenfold-bot'];
            const { owner, repo } = context.repo;

            const packetDiffOut = execSync(
              `git diff --name-only origin/main...HEAD -- '.github/pipeline/source-packets/vulncheck-kev/*.json'`,
              { encoding: 'utf8' },
            );
            const packetPaths = packetDiffOut.split('\n').map(s => s.trim()).filter(Boolean);
            const packets = [];
            for (const p of packetPaths) {
              if (p.endsWith('/latest.json')) continue;
              try {
                const packet = JSON.parse(fs.readFileSync(p, 'utf8'));
                const candidate = packet.candidate || {};
                const prefill = packet.source_packet_prefill || {};
                const product = (prefill.affected_products && prefill.affected_products[0]) || {};
                packets.push({
                  path: p,
                  cves: Array.isArray(candidate.cves) ? candidate.cves : [],
                  bucket: candidate.recency_bucket || '—',
                  date: candidate.vulncheck_exploitation_signal?.date_added || '—',
                  score: candidate.priority_score ?? null,
                  officialCisa: !!candidate.official_cisa_kev?.listed,
                  canary: !!candidate.vulncheck_exploitation_signal?.reported_exploited_by_vulncheck_canaries,
                  vendor: product.vendor || '—',
                  product: product.product || '—',
                });
              } catch (e) {
                console.log(`Failed to parse ${p}: ${e.message}`);
              }
            }

            packets.sort((a, b) => {
              if (a.date !== b.date) return String(b.date).localeCompare(String(a.date));
              return (b.score ?? 0) - (a.score ?? 0);
            });

            const title = `Pipeline discovery — ${packets.length} VulnCheck prefill${packets.length === 1 ? '' : 's'} pending`;
            let body = `## VulnCheck KEV Source-Packet Prefill Batch\n\n`;
            body += `This PR stages a bounded VulnCheck KEV source-packet prefill batch from \`${BRANCH}\` for review before landing on \`main\`.\n\n`;
            body += `These are prioritization/source-packet artifacts only. They do not create article drafts, do not mark official CISA KEV membership, and require prominent VulnCheck KEV attribution if surfaced.\n`;
            body += `When the active VulnCheck prefill PR reaches the configured pending cap, scheduled discovery rolls over to a separate PR instead of overfilling the current one.\n\n`;
            body += `Review requested: @MahdiHedhli @dangermouse-bot @ernestpenfold-bot.\n\n`;
            body += `| CVE | Date added | Bucket | Score | CISA date present | Canary signal | Vendor / product | Artifact |\n`;
            body += `|---|---|---|---:|:-:|:-:|---|---|\n`;
            for (const packet of packets) {
              const cveCell = packet.cves.length > 0 ? packet.cves.map(cve => `\`${cve}\``).join(', ') : '—';
              const artifact = packet.path.replace(/^\.\//, '');
              body += `| ${cveCell} | ${packet.date} | ${packet.bucket} | ${packet.score == null ? '—' : packet.score} | ${packet.officialCisa ? '✓' : '—'} | ${packet.canary ? '✓' : '—'} | ${`${packet.vendor} / ${packet.product}`.replace(/\|/g, '\\|')} | \`${artifact}\` |\n`;
            }
            body += `\n---\n\n`;
            body += `_Last updated: ${new Date().toISOString()} · Run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) · See [docs/PIPELINE.md](${context.serverUrl}/${owner}/${repo}/blob/main/docs/PIPELINE.md) for the end-to-end flow._\n`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${BRANCH}`,
              per_page: 5,
            });

            let pr;
            if (existing.length > 0) {
              pr = existing[0];
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title, body });
            } else {
              const created = await github.rest.pulls.create({ owner, repo, head: BRANCH, base: 'main', title, body });
              pr = created.data;
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
              } catch (e) {
                console.log(`Could not add label ${LABEL} to PR #${pr.number}: ${e.message}`);
              }
            }

            try {
              await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers: REVIEWERS });
            } catch (e) {
              console.log(`Could not request all reviewers on PR #${pr.number}: ${e.message}`);
            }
